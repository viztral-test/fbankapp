server.port=8080

# Local in-memory H2 database (data is lost on restart)
spring.datasource.url=jdbc:h2:mem:fbankdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Schema is generated from the JPA entities on every start
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# H2 web console for local development: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Money is serialized as plain JSON numbers with two decimals (never scientific notation)
spring.jackson.generator.write-bigdecimal-as-plain=true

# Never include stack traces or exception messages in error responses
server.error.include-stacktrace=never
server.error.include-message=never

# --- fbankapp settings ---
# Lifetime of a login token (fixed, not extended by activity)
fbankapp.token-ttl=60m
# Seeds the local-testing demo account (demo / Demo@1234). Set to false outside a developer machine.
fbankapp.seed-demo-data=true
# Currency code given to new wallets
fbankapp.currency=USD
# Browser origins allowed to call the API (comma-separated)
fbankapp.cors-allowed-origins=http://localhost:4200
